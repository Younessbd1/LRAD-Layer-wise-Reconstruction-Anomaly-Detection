# LRAD Configuration - MNIST + CNN with NESTED (cascaded) decoders.
# Each decoder D_k inverts only its adjacent classifier block.
# x̂_k is built at inference by chaining D_0(D_1(...D_k(a_k))).

experiment:
  name: "mnist_cnn_nested"
  seed: 42
  output_dir: "outputs/mnist_cnn_nested"

dataset:
  name: "mnist"
  normal_classes: [0, 1, 2, 3]
  batch_size: 64
  data_root: "./data"

model:
  architecture: "cnn"
  decoder_type: "nested"     # ← switches the LRAD wrapper + trainer
  channels: [1, 8, 16, 32, 64]
  input_size: 28
  num_classes: 4

training:
  classifier:
    epochs: 30
    lr: 0.001
  decoders:
    epochs: 40
    lr: 0.001

evaluation:
  fusion: "mean"
  n_display: 10
  max_eval_batches: null
