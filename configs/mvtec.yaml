# ---------------------------------------------------------------------------
# MVTec AD — LRAD ensemble, per-category, for direct comparison to PatchCore.
#
# ARCHITECTURE IS THE ONE IN docs/diagrams/. This config is deliberately the
# same network as encoder_decoder.pdf / classifier_pipeline.pdf /
# ensemble_diversity_cubes.pdf, and the same 10-member diversity set as the
# CelebA run in outputs/celeba_ood/LASTOF_RESULTS:
#
#   * 128x128x3 input, FIVE conv blocks, bottleneck 8x8
#     (128 -> 64 -> 32 -> 16 -> 8 -> 8), one frozen-trunk BlockDecoder tap
#     per block — exactly the encoder_decoder figure.
#   * TEN members, the same channels/kernel pairs the cubes figure draws
#     (six 3x3 members, four 5x5 members, widths 16 - 384).
#   * Same optimizer settings and the same schedule length as the CelebA
#     cp128 run: lr 3e-4 trunk / 1e-3 decoders, and a budget no larger than
#     that run's (see `training` below) — no extra epochs.
#
# What still differs from CelebA, because the DATASET forces it:
#
#   1. NO SUPERVISED HEADS. MVTec is a cold-start benchmark: the training
#      split of each category holds nominal images only and carries no
#      labels at all. The diagram's `gender -> 2` and `attrs -> 6` heads
#      have nothing to train against, so they are off and the trunk trains
#      on the CutPaste pretext alone.
#   2. 3-WAY CUTPASTE, not the binary head in the figure. MVTec defects come
#      in both shapes — scratches and cracks are scar-like, dents and
#      missing parts box-like — so the intact / box / scar form from Li et
#      al., CVPR 2021 is used and `scar_prob` is a real mix.
#   3. PER-CATEGORY MODELS. PatchCore fits one memory bank per category and
#      reports the 15-category mean; scripts/run_mvtec.py mirrors that,
#      training a fresh ensemble for each `dataset.categories` entry.
#
# RESOLUTION CAVEAT. PatchCore evaluates at 256 -> 224. This config runs at
# 128 px because that is what the diagrams specify and what the CelebA
# reference run used. Detection AUROC is fairly insensitive to that, but
# pixel AUROC and PRO are scored on a 128^2 grid, so the localization
# columns are NOT strictly like-for-like with the published numbers — read
# them as "at half the resolution". Switch `image_size`/`crop_size` to
# 256/224 and add a sixth block to `channels` (and to every variant) if a
# like-for-like localization number is what you need; that is a different
# architecture from the diagrams.
#
# Targets to beat (PatchCore-10%, mean over all 15 categories):
#      image AUROC 99.0   pixel AUROC 98.1   PRO 93.5
# Pilot categories below are deliberately mixed: bottle (easy object,
# PatchCore 100), carpet (texture), screw (PatchCore's weakest PRO, 87.4),
# transistor (weakest pixel AUROC, 96.4).
# ---------------------------------------------------------------------------

experiment:
  name: "mvtec_lrad"
  seed: 42
  output_dir: "outputs/mvtec/run"

dataset:
  root: "./data"
  # The pilot set. Use `--categories all` on the runner for the full 15.
  # hazelnut is the fifth: 391 training images, the largest split in MVTec,
  # so it is the category that gets the most gradient per epoch and is the
  # least likely to be schedule-limited — a useful control against the
  # other four (209-320 images).
  categories: [bottle, carpet, screw, transistor, hazelnut]
  # 128 px, no centre crop — the input tensor the diagrams are drawn for,
  # and what the CelebA cp128 run fed the trunk. Cropping is also the wrong
  # move here: MVTec defects sit near the image border often enough that a
  # 0.875 centre crop would discard ground-truth mask area and quietly
  # depress PRO.
  image_size: 128
  crop_size: 128
  # 32, not CelebA's 128: a category holds 60-391 training images, so a
  # batch of 128 would buy 1-3 optimizer steps per epoch.
  batch_size: 32
  num_workers: 4
  # No validation split: MVTec train sets are small (~200-400 images) and
  # every held-out nominal image is one the decoders never learn to
  # reconstruct. Same choice as the CelebA cp128 run — full schedule, no
  # early stopping, final-epoch weights.
  val_ratio: 0.00
  pin_memory: true
  seed: 42

model:
  in_channels: 3
  # Five blocks at 128 px: 128 -> 64 -> 32 -> 16 -> 8 -> 8. This is the
  # baseline lane of ensemble_diversity_cubes (Model 1) and the trunk drawn
  # in encoder_decoder.
  channels: [32, 64, 128, 256, 256]
  kernel_size: 3
  # Cold start: no labels exist, so both supervised heads are off and the
  # pretext head is the only training signal.
  gender_head: false
  attrs_head: false
  cutpaste_head: true
  cutpaste_classes: 3

training:
  # SCHEDULE IS IN OPTIMIZER STEPS, NOT EPOCHS. MVTec categories hold 60
  # (toothbrush) to 391 (hazelnut) training images, so at batch 32 a fixed
  # epoch count buys 2-13 steps per epoch — a 6.5x spread in how much
  # training each category receives, which would make the per-category
  # table meaningless. `steps` is converted to an epoch count per category
  # by scripts/run_mvtec.py; `epochs` below is only the fallback if
  # `steps` is removed.
  #
  # The budget is BELOW the CelebA reference run, not above it: cp128 spent
  # 20 epochs x ~1,140 batches = ~22,800 trunk steps and 25 x ~1,140 =
  # ~28,500 decoder steps. 4,000 / 8,000 here is a fraction of that, and it
  # is deliberately unchanged from the 4-member version of this config —
  # the ensemble grew to 10 members, the per-member schedule did not.
  #
  # Do not cut it much further. At 420 decoder steps (60 epochs on bottle)
  # the decoders never individuate: they converge to the dataset mean, and
  # the bias map degenerates into |x - mean image|, correlating ~0.85 with
  # image brightness and scoring BELOW 0.5 pixel AUROC — MVTec defects are
  # often dark, hence easier to reconstruct than nominal texture.
  steps: 4000
  epochs: 40
  save_every_epoch: false
  lr: 0.0003
  attr_loss_weight: 0.0   # unused (no attr head); kept explicit
  log_every: 50

  # CutPaste pretext. `scar_prob: 0.5` is a real mix here, unlike the
  # CelebA winner (0.0): MVTec defects genuinely come in both shapes —
  # scratches and cracks are scar-like, dents and missing parts box-like —
  # and the 3-way head needs both classes populated to learn either.
  # `loss_weight: 1.0`, also unlike CelebA's 0.5, because on MVTec this is
  # the only loss the trunk has rather than an auxiliary to two supervised
  # heads.
  cutpaste:
    prob: 0.5
    area_range: [0.02, 0.15]
    aspect_range: [0.3, 3.3]
    scar_prob: 0.5
    loss_weight: 1.0

  decoders:
    # The reconstruction IS the anomaly score, so the decoders get the
    # larger budget of the two — the same 20 : 25 trunk-to-decoder ratio
    # the CelebA run used, rounded to the step budget above.
    steps: 8000
    epochs: 60
    lr: 0.001
    log_every: 100

evaluation:
  n_viz_in_samples: 8
  n_viz_ood_samples: 12
  viz_seed: 1234
  # Pixel-level localization (lrad.pixel_metrics).
  pixel_metrics: true
  # PatchCore smooths its segmentation map with a Gaussian of sigma=4 at
  # 224 px; halved to 2.0 to cover the same fraction of a 128 px map.
  smooth_sigma: 2.0
  pro_fpr_limit: 0.30
  # Rows per qualitative panel. Two panels are written per category — the
  # highest- and the lowest-scoring defective images — so failures are as
  # visible as successes.
  n_instances: 6
  # Display-only blur for the overlay column. Never affects a score.
  overlay_sigma: 1.5

ensemble:
  # Ten members, the diversity set drawn in
  # docs/diagrams/ensemble_diversity_cubes.pdf and used by the CelebA
  # LASTOF_RESULTS run — same channel widths, same kernel sizes, same
  # order, so member i here is member i there. Seeds are base_seed + i
  # (42..51), matching the per-member labels in that figure.
  size: 10
  base_seed: 42
  agg: p95
  member_variants:
    - {channels: [32, 64, 128, 256, 256], kernel_size: 3}   # M1  982 k
    - {channels: [24, 48, 96, 192, 384], kernel_size: 3}    # M2  887 k
    - {channels: [48, 96, 192, 256, 256], kernel_size: 3}   # M3  1.25 M
    - {channels: [16, 48, 96, 192, 320], kernel_size: 5}    # M4  2.14 M
    - {channels: [40, 80, 160, 320, 320], kernel_size: 3}   # M5  1.53 M
    - {channels: [32, 64, 128, 256, 256], kernel_size: 5}   # M6  2.72 M
    - {channels: [64, 96, 160, 224, 288], kernel_size: 3}   # M7  1.10 M
    - {channels: [24, 64, 128, 192, 256], kernel_size: 5}   # M8  2.09 M
    - {channels: [48, 64, 96, 192, 384], kernel_size: 3}    # M9  919 k
    - {channels: [32, 48, 112, 224, 336], kernel_size: 5}   # M10 2.69 M
