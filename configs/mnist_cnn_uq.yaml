# LRAD-UQ Configuration — MNIST + CNN + MC Dropout

experiment:
  name: "mnist_cnn_mcdropout"
  seed: 42
  output_dir: "outputs/mnist_cnn_mcdropout"

dataset:
  name: "mnist"
  normal_classes: [0, 1, 2, 3]
  batch_size: 64
  data_root: "./data"

model:
  architecture: "cnn"
  channels: [1, 8, 16, 32, 64]
  input_size: 28
  num_classes: 4

uq:
  method: "mc_dropout"      # mc_dropout | ensemble
  mc_samples: 30            # T forward passes for MC Dropout
  n_ensemble: 5             # M members for ensemble
  dropout_rate: 0.2

training:
  classifier:
    epochs: 15
    lr: 0.001
  decoders:
    epochs: 20
    lr: 0.001

evaluation:
  fusion: "mean"
  n_display: 10
  max_eval_batches: null
