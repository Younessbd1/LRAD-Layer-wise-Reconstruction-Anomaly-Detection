# Fast config for parallel-vs-nested decoder comparison.
# Smaller epoch counts so the comparison runs in reasonable CPU time.

experiment:
  name: "mnist_cnn_compare"
  seed: 42
  output_dir: "outputs/mnist_cnn_compare"

dataset:
  name: "mnist"
  normal_classes: [0, 1, 2, 3]
  batch_size: 128
  data_root: "./data"

model:
  architecture: "cnn"
  channels: [1, 8, 16, 32, 64]
  input_size: 28
  num_classes: 4

training:
  classifier:
    epochs: 25
    lr: 0.001
  decoders:
    epochs: 35
    lr: 0.001

evaluation:
  fusion: "mean"
  n_display: 10
  max_eval_batches: 8
