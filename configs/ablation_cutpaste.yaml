# ---------------------------------------------------------------------------
# ABLATION — arm "cutpaste": same-architecture ensemble WITH CutPaste.
#
# Case study 2: what does the CutPaste pretext buy over the seed-only
# baseline? Identical to ablation_baseline.yaml except the pretext task —
# every member carries the binary CutPaste head and trains with the
# grid-search winner (job 6781780, rank 1 of 30 by fused AUROC): big box
# patches only, no scars, light pretext weight. The supervised losses are
# computed on intact faces only; P(altered | x) joins the fusion signals.
#
# See ablation_baseline.yaml for the full arm table and the invariants.
# Submit with scripts/oar_run_ablation.sh (one OAR job per arm).
# ---------------------------------------------------------------------------

experiment:
  name: "celeba_ood_abl_cutpaste"
  seed: 42
  output_dir: "outputs/celeba_ood/ablation/cutpaste"

dataset:
  root: "./data"
  download: false
  image_size: 128
  batch_size: 128
  num_workers: 4
  train_ratio: 0.90
  val_ratio: 0.00
  pin_memory: true
  seed: 42
  ood_attrs: [Eyeglasses]

model:
  in_channels: 3
  channels: [32, 64, 128, 256, 256]
  kernel_size: 3
  n_attrs: 6
  n_gender: 2
  cutpaste_head: true

training:
  epochs: 20
  save_every_epoch: false   # per-epoch checkpoints double at 128 px; off
  lr: 0.0003
  attr_loss_weight: 2.0
  log_every: 1

  # CutPaste pretext (lrad.cutpaste.cutpaste_batch) — grid-search winner.
  cutpaste:
    prob: 0.5
    area_range: [0.05, 0.15]
    aspect_range: [0.3, 3.3]
    scar_prob: 0.0
    loss_weight: 0.5

  decoders:
    epochs: 25
    lr: 0.001
    log_every: 1

evaluation:
  n_viz_in_samples: 10
  n_viz_ood_samples: 15
  viz_seed: 1234
  n_instances_in: 20
  n_instances_ood: 20
  overlay_sigma: 1.5
  overlay_power: 0.8
  n_top_ood: 10

# No member_variants: every member is built from the model section above,
# so besides the pretext the ensemble's only diversity is the seed.
ensemble:
  size: 10
  base_seed: 42
  agg: p95
