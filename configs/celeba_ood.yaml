# ---------------------------------------------------------------------------
# CelebA OOD configuration.
#
# Task:
#   In-distribution = faces with none of the OOD accessories
#   OOD             = faces wearing eyeglasses (sunglasses included) OR a hat
#                     (see dataset.ood_attrs below to change the set)
#
# Targets:
#   gender (Male/Female) — 2-way softmax + CrossEntropyLoss
#   6 binary attributes  — sigmoid + BCEWithLogitsLoss
#     [Young, Smiling, Mouth_Slightly_Open, High_Cheekbones,
#      Pointy_Nose, Oval_Face]
#
# Run:
#   python scripts/run_celeba.py --config configs/celeba_ood.yaml
# ---------------------------------------------------------------------------

experiment:
  name: "celeba_ood"
  seed: 42
  output_dir: "outputs/celeba_ood/run"

# ---- Data --------------------------------------------------------------
# val_ratio=0 disables the validation split entirely: all in-dist images
# outside the test split are used for training. There is no early stopping
# and no val_loss curve — every model runs for exactly `epochs` epochs.
# This is what the LRAD note calls for: a clean deep ensemble where
# diversity comes only from the init + shuffle order.
dataset:
  root: "./data"          # parent dir of the celeba/ folder
  download: false         # set true to let torchvision download
  image_size: 64
  batch_size: 256
  num_workers: 4
  train_ratio: 0.90
  val_ratio: 0.00
  pin_memory: true
  seed: 42
  # OOD = any of these accessories present; in-dist = none of them. A single
  # string still works (e.g. ood_attrs: Eyeglasses) for the glasses-only task.
  ood_attrs: [Eyeglasses, Wearing_Hat]

# ---- Model --------------------------------------------------------------
# 6 conv blocks, no pretrained weights. Each block:
#   Conv3x3 + BN + ReLU + MaxPool2x2 (last block: no pool)
# The extra block 256→256 with a MaxPool doubles the spatial compression
# of the final feature map (4×4 → 2×2 → GAP), so the deepest activations
# encode a much more abstract summary of the face.
# No Dropout: ensemble diversity for the bias/variance decomposition comes
# from independent weight init + SGD shuffle order (deep ensemble), not
# from MC-Dropout.
model:
  in_channels: 3
  channels: [32, 64, 128, 256, 256, 256]
  n_attrs: 6
  n_gender: 2

# ---- Training -----------------------------------------------------------
# Combined loss = CrossEntropy(gender) + attr_loss_weight * BCE(attrs).
# Single .backward() per step. With val_ratio=0 there is no validation
# loop — every model runs the full `epochs` schedule.
training:
  # Long schedule. With save_every_epoch=true a checkpoint is written at
  # the end of EVERY epoch (model_ep{e}.pt / decoders_ep{e}.pt) so that
  # scripts/epoch_variability_study.py can trace the inter-model
  # variability sigma(e) as a function of the number of training epochs.
  epochs: 25
  save_every_epoch: true
  lr: 0.0003
  attr_loss_weight: 2.0
  log_every: 1

  # --- Per-block decoders -----------------------------------------------
  # After classifier training, freeze the classifier and train one small
  # decoder per conv block to reconstruct the input from that block's
  # activations. These reconstructions are what the anomaly score is built
  # on: across the ensemble they drive the bias/variance decomposition
  # (run_ensemble.py), and per model they feed the per-block plots + fused
  # error score. Set this section to ~null~ to skip decoder training.
  #
  # Same long schedule as the classifier; per-epoch checkpoints
  # (decoders_ep{e}.pt, controlled by save_every_epoch above) feed the
  # sigma(e) epoch-variability study.
  decoders:
    epochs: 25
    lr: 0.001
    # Decoder upsampling stage: "bilinear" (resize-then-conv, smoother, the
    # default) or "transpose" (ConvTranspose2d — the original learnable
    # upsampling; can leave faint checkerboard texture in the error maps).
    upsample: bilinear
    log_every: 1

# ---- Evaluation ---------------------------------------------------------
# Grid plots use 10 in-dist + 15 OOD samples (randomly drawn from the test
# loaders with a fixed seed, so the picks are reproducible).
#
# The ensemble runner also writes per-instance figures — one PNG per face
# under ensemble/plots/instances_{in,ood}/ — each showing every member's
# reconstruction + error, the bias / mean / min summary, and the smoothed
# bias overlaid on the face. n_instances_* sets how many of each are saved;
# instance_block picks the reconstruction depth (default = deepest block,
# same as the score comparison); overlay_sigma and overlay_power are the two
# display knobs of the bias overlay (blur, then alpha = cam ** power).
evaluation:
  n_viz_in_samples: 10
  n_viz_ood_samples: 15
  viz_seed: 1234
  n_instances_in: 20
  n_instances_ood: 20
  overlay_sigma: 7
  overlay_power: 0.8

# ---- Ensemble (bias/variance decomposition) -----------------------------
# scripts/run_ensemble.py trains `size` independent models (classifier +
# decoders), each seeded with base_seed + i, then decomposes the per-block
# reconstruction risk into:
#   Risk      = E_D[ E[(x - f_hat(x))^2] ]   (per-model error, averaged)
#   Bias      = E[(x - E_D[f_hat(x)])^2]     (error of the mean recon)
#   Variance  = E[ E_D[(f_hat(x) - E_D[f_hat(x)])^2] ]   (model spread)
# with the exact per-pixel identity Risk = Bias + Variance.
ensemble:
  size: 10
  base_seed: 42      # models are seeded 42, 43, ..., 51
  agg: p95           # pixel -> scalar reduction for the decomposition scores
