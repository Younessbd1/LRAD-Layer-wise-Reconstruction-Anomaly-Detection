# ---------------------------------------------------------------------------
# CelebA OOD — CutPaste + 128 px variant of configs/celeba_ood.yaml.
#
# Two changes over the base config, both aimed at pushing the OOD AUROC
# past the ~0.81 post-hoc ceiling measured on the 64 px ensemble:
#
#   1. image_size 128 — eyeglasses grow from ~500 to ~2 000 pixels, so
#      the localized signals (locfre, pixel z-score) resolve them better.
#      The trunk keeps the same 5-block layout (128 → 64 → 32 → 16 → 8 → 8).
#   2. CutPaste pretext task — each model gets a third binary head trained
#      to tell intact faces from faces with a pasted donor patch/scar
#      (lrad.cutpaste). P(altered|x) becomes an extra fusion signal that
#      fires on real occlusions the models never saw. Hyperparameters
#      below are the grid-search defaults — override with the winners of
#      scripts/run_gridsearch.py once it has run.
#
# Cost control vs the base config: 128 px costs ~4x per image, so
# batch_size drops to 128. The ensemble keeps the full 10 members (one
# architecture variant each). Submit with scripts/oar_run_cutpaste128.sh.
# ---------------------------------------------------------------------------

experiment:
  name: "celeba_ood_cp128"
  seed: 42
  output_dir: "outputs/celeba_ood/run_cp128"

dataset:
  root: "./data"
  download: false
  image_size: 128
  batch_size: 128
  num_workers: 4
  train_ratio: 0.90
  val_ratio: 0.00
  pin_memory: true
  seed: 42
  ood_attrs: [Eyeglasses]

model:
  in_channels: 3
  channels: [32, 64, 128, 256, 256]
  kernel_size: 3
  n_attrs: 6
  n_gender: 2
  cutpaste_head: true

training:
  epochs: 20
  save_every_epoch: false   # per-epoch checkpoints double at 128 px; off
  lr: 0.0003
  attr_loss_weight: 2.0
  log_every: 1

  # CutPaste pretext (lrad.cutpaste.cutpaste_batch). Supervised losses are
  # computed on intact images only; the pretext CE covers the whole batch.
  # Values = winner of the multi-metric grid search (job 6781780, rank 1 of
  # 30 by fused AUROC 0.827): big box patches only, no scars, light pretext
  # weight. See outputs/celeba_ood/gridsearch_6781780/.
  cutpaste:
    prob: 0.5
    area_range: [0.05, 0.15]
    aspect_range: [0.3, 3.3]
    scar_prob: 0.0
    loss_weight: 0.5

  decoders:
    epochs: 25
    lr: 0.001
    log_every: 1

evaluation:
  n_viz_in_samples: 10
  n_viz_ood_samples: 15
  viz_seed: 1234
  n_instances_in: 20
  n_instances_ood: 20
  overlay_sigma: 1.5
  overlay_power: 0.8
  n_top_ood: 10

ensemble:
  size: 10
  base_seed: 42
  agg: p95
  member_variants:
    - {channels: [32, 64, 128, 256, 256], kernel_size: 3}   # baseline
    - {channels: [24, 48, 96, 192, 384], kernel_size: 3}    # slim early, wide late
    - {channels: [48, 96, 192, 256, 256], kernel_size: 3}   # wide early
    - {channels: [16, 48, 96, 192, 320], kernel_size: 5}    # slim + large RF
    - {channels: [40, 80, 160, 320, 320], kernel_size: 3}   # 1.25x width
    - {channels: [32, 64, 128, 256, 256], kernel_size: 5}   # baseline, large RF
    - {channels: [64, 96, 160, 224, 288], kernel_size: 3}   # flat progression
    - {channels: [24, 64, 128, 192, 256], kernel_size: 5}   # narrow late, large RF
    - {channels: [48, 64, 96, 192, 384], kernel_size: 3}    # heavy head + tail
    - {channels: [32, 48, 112, 224, 336], kernel_size: 5}   # steep growth, large RF
