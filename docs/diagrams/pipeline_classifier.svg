<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="620" viewBox="0 0 1460 620" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7684"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d98246"/>
    </marker>
    <style>
      .ttl  { font-size: 21px; font-weight: 700; fill: #14203a; }
      .sub  { font-size: 12.5px; fill: #5c6b81; }
      .bt   { font-size: 13.5px; font-weight: 700; fill: #14203a; }
      .bl   { font-size: 11.5px; fill: #33445e; }
      .shape{ font-size: 11.5px; font-weight: 600; fill: #4a7fc1; font-family: ui-monospace, Menlo, monospace; }
      .note { font-size: 11px; fill: #6b7684; }
      .tap  { font-size: 11px; font-weight: 600; fill: #d98246; font-family: ui-monospace, Menlo, monospace; }
      .sec  { font-size: 12px; font-weight: 700; fill: #8a94a6; letter-spacing: .08em; }
    </style>
  </defs>

  <rect width="1460" height="620" fill="#ffffff"/>
  <text class="ttl" x="30" y="38">Pipeline « classifieur » — FacialCNN (membre 0 : channels [32,64,128,256,256], k=3)</text>
  <text class="sub" x="30" y="60">lrad/model.py · lrad/cutpaste.py · lrad/train.py — entrée 128×128, 981 802 paramètres entraînables</text>

  <!-- CutPaste lane -->
  <rect x="30" y="92" width="470" height="72" rx="8" fill="#fff8f2" stroke="#d98246" stroke-dasharray="5 4" stroke-width="1.4"/>
  <text class="bt" x="46" y="115" fill="#a85c22">CutPaste — entraînement uniquement</text>
  <text class="bl" x="46" y="134">prob=0.5 · area∈[0.05,0.15] · aspect∈[0.3,3.3] · scar_prob=0</text>
  <text class="bl" x="46" y="152">patch pris sur le donneur x[i+1 mod B] → étiquette y_cp ∈ {0,1}</text>
  <path d="M 240 164 L 240 196" stroke="#d98246" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arg)" fill="none"/>

  <!-- Input -->
  <rect x="30" y="200" width="120" height="128" rx="8" fill="#f4f7fc" stroke="#8fa6c4" stroke-width="1.5"/>
  <text class="bt" x="90" y="238" text-anchor="middle">Image x</text>
  <text class="bl" x="90" y="258" text-anchor="middle">CelebA alignée</text>
  <text class="bl" x="90" y="275" text-anchor="middle">Resize 128²</text>
  <text class="bl" x="90" y="292" text-anchor="middle">ToTensor ∈ [0,1]</text>
  <text class="shape" x="90" y="314" text-anchor="middle">3×128×128</text>
  <path d="M 150 264 L 186 264" stroke="#6b7684" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- Conv blocks -->
  <g>
    <!-- B1 -->
    <rect x="190" y="200" width="146" height="128" rx="8" fill="#e8f0fb" stroke="#4a7fc1" stroke-width="1.6"/>
    <text class="bt" x="263" y="223" text-anchor="middle">Bloc 1</text>
    <text class="bl" x="263" y="244" text-anchor="middle">Conv 3×3 → 32</text>
    <text class="bl" x="263" y="262" text-anchor="middle">BatchNorm2d</text>
    <text class="bl" x="263" y="280" text-anchor="middle">ReLU</text>
    <text class="bl" x="263" y="298" text-anchor="middle">MaxPool 2×2</text>
    <text class="shape" x="263" y="320" text-anchor="middle">32×64×64</text>
    <path d="M 336 264 L 366 264" stroke="#6b7684" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
    <!-- B2 -->
    <rect x="370" y="200" width="146" height="128" rx="8" fill="#e8f0fb" stroke="#4a7fc1" stroke-width="1.6"/>
    <text class="bt" x="443" y="223" text-anchor="middle">Bloc 2</text>
    <text class="bl" x="443" y="244" text-anchor="middle">Conv 3×3 → 64</text>
    <text class="bl" x="443" y="262" text-anchor="middle">BatchNorm2d</text>
    <text class="bl" x="443" y="280" text-anchor="middle">ReLU</text>
    <text class="bl" x="443" y="298" text-anchor="middle">MaxPool 2×2</text>
    <text class="shape" x="443" y="320" text-anchor="middle">64×32×32</text>
    <path d="M 516 264 L 546 264" stroke="#6b7684" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
    <!-- B3 -->
    <rect x="550" y="200" width="146" height="128" rx="8" fill="#e8f0fb" stroke="#4a7fc1" stroke-width="1.6"/>
    <text class="bt" x="623" y="223" text-anchor="middle">Bloc 3</text>
    <text class="bl" x="623" y="244" text-anchor="middle">Conv 3×3 → 128</text>
    <text class="bl" x="623" y="262" text-anchor="middle">BatchNorm2d</text>
    <text class="bl" x="623" y="280" text-anchor="middle">ReLU</text>
    <text class="bl" x="623" y="298" text-anchor="middle">MaxPool 2×2</text>
    <text class="shape" x="623" y="320" text-anchor="middle">128×16×16</text>
    <path d="M 696 264 L 726 264" stroke="#6b7684" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
    <!-- B4 -->
    <rect x="730" y="200" width="146" height="128" rx="8" fill="#e8f0fb" stroke="#4a7fc1" stroke-width="1.6"/>
    <text class="bt" x="803" y="223" text-anchor="middle">Bloc 4</text>
    <text class="bl" x="803" y="244" text-anchor="middle">Conv 3×3 → 256</text>
    <text class="bl" x="803" y="262" text-anchor="middle">BatchNorm2d</text>
    <text class="bl" x="803" y="280" text-anchor="middle">ReLU</text>
    <text class="bl" x="803" y="298" text-anchor="middle">MaxPool 2×2</text>
    <text class="shape" x="803" y="320" text-anchor="middle">256×8×8</text>
    <path d="M 876 264 L 906 264" stroke="#6b7684" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>
    <!-- B5 -->
    <rect x="910" y="200" width="146" height="128" rx="8" fill="#e8f0fb" stroke="#4a7fc1" stroke-width="1.6"/>
    <text class="bt" x="983" y="223" text-anchor="middle">Bloc 5</text>
    <text class="bl" x="983" y="244" text-anchor="middle">Conv 3×3 → 256</text>
    <text class="bl" x="983" y="262" text-anchor="middle">BatchNorm2d</text>
    <text class="bl" x="983" y="280" text-anchor="middle">ReLU</text>
    <text class="bl" x="983" y="298" text-anchor="middle" fill="#8a94a6">(pas de pooling)</text>
    <text class="shape" x="983" y="320" text-anchor="middle">256×8×8</text>
  </g>
  <path d="M 1056 264 L 1090 264" stroke="#6b7684" stroke-width="1.6" marker-end="url(#ar)" fill="none"/>

  <!-- GAP -->
  <rect x="1094" y="220" width="96" height="88" rx="8" fill="#f4f7fc" stroke="#8fa6c4" stroke-width="1.5"/>
  <text class="bt" x="1142" y="250" text-anchor="middle">GAP</text>
  <text class="bl" x="1142" y="270" text-anchor="middle">AdaptiveAvg</text>
  <text class="bl" x="1142" y="286" text-anchor="middle">Pool 1×1</text>
  <text class="shape" x="1142" y="303" text-anchor="middle">h ∈ ℝ²⁵⁶</text>

  <!-- Heads -->
  <path d="M 1190 264 L 1216 200" stroke="#6b7684" stroke-width="1.4" marker-end="url(#ar)" fill="none"/>
  <path d="M 1190 264 L 1216 264" stroke="#6b7684" stroke-width="1.4" marker-end="url(#ar)" fill="none"/>
  <path d="M 1190 264 L 1216 328" stroke="#6b7684" stroke-width="1.4" marker-end="url(#ar)" fill="none"/>

  <rect x="1220" y="168" width="210" height="62" rx="8" fill="#eaf6ec" stroke="#4d9b62" stroke-width="1.6"/>
  <text class="bt" x="1234" y="190">head_gender · Linear 256→2</text>
  <text class="bl" x="1234" y="209">softmax → p_g ;  CE(p_g, Male)</text>
  <text class="note" x="1234" y="224">→ MSP, entropie, énergie</text>

  <rect x="1220" y="234" width="210" height="62" rx="8" fill="#eaf6ec" stroke="#4d9b62" stroke-width="1.6"/>
  <text class="bt" x="1234" y="256">head_attrs · Linear 256→6</text>
  <text class="bl" x="1234" y="275">sigmoïde → p_a ;  BCE, poids 2.0</text>
  <text class="note" x="1234" y="290">6 attributs, 4 péri-oculaires</text>

  <rect x="1220" y="300" width="210" height="62" rx="8" fill="#fff8f2" stroke="#d98246" stroke-width="1.6"/>
  <text class="bt" x="1234" y="322" fill="#a85c22">head_cutpaste · Linear 256→2</text>
  <text class="bl" x="1234" y="341">softmax → P(altéré | x) ; CE ×0.5</text>
  <text class="note" x="1234" y="356">signal OOD direct au test</text>

  <!-- Taps to decoders -->
  <g stroke="#d98246" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <path d="M 263 328 L 263 396" marker-end="url(#arg)"/>
    <path d="M 443 328 L 443 396" marker-end="url(#arg)"/>
    <path d="M 623 328 L 623 396" marker-end="url(#arg)"/>
    <path d="M 803 328 L 803 396" marker-end="url(#arg)"/>
    <path d="M 983 328 L 983 396" marker-end="url(#arg)"/>
  </g>
  <rect x="190" y="400" width="866" height="52" rx="8" fill="#fff8f2" stroke="#d98246" stroke-width="1.5"/>
  <text class="bt" x="623" y="422" text-anchor="middle" fill="#a85c22">Activations a₀ … a₄ prélevées après chaque bloc  (forward_with_activations)</text>
  <text class="bl" x="623" y="441" text-anchor="middle">→ décodeurs par bloc (voir pipeline_decoder.svg) · → signal locfre (features ré-encodées)</text>

  <!-- Loss box -->
  <rect x="1094" y="400" width="336" height="52" rx="8" fill="#f6f2fb" stroke="#8b63b8" stroke-width="1.5"/>
  <text class="bt" x="1262" y="422" text-anchor="middle" fill="#6a4590">Perte totale (étape 1, 20 époques, Adam 3e-4)</text>
  <text class="bl" x="1262" y="441" text-anchor="middle">L = CE_genre + 2·BCE_attrs + 0.5·CE_cutpaste</text>

  <!-- Footnotes -->
  <text class="sec" x="30" y="500">NOTES DE FIDÉLITÉ AU CODE</text>
  <text class="note" x="30" y="522">• Le pooling est appliqué après chaque bloc SAUF le dernier (model.py : pool = i &lt; len(channels)−1) → tailles spatiales 64, 32, 16, 8, 8.</text>
  <text class="note" x="30" y="542">• Le padding vaut kernel_size//2, donc H et W ne changent pas dans la convolution : seul le MaxPool divise la résolution par 2.</text>
  <text class="note" x="30" y="562">• Les pertes genre/attributs ne sont calculées que sur les images INTACTES du batch (masque intact = (y_cp == 0)) — un patch collé peut cacher l’évidence de l’étiquette.</text>
  <text class="note" x="30" y="582">• Les 8 membres partagent ce schéma mais pas ses largeurs : ensemble.member_variants change channels et kernel_size (3 ou 5) ; le nombre de blocs reste 5 pour tous.</text>
  <text class="note" x="30" y="602">• val_ratio = 0 → aucune validation, aucun early stopping : les poids de la 20ᵉ époque sont conservés tels quels.</text>
</svg>
