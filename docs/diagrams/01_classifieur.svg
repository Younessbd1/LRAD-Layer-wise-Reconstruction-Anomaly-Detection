<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1050" width="860" height="1050">
  <defs>
    <linearGradient id="g-hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E3A8A"/><stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="g-blk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E40AF"/><stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="g-blk6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="g-inp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369A1"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="g-gap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B21B6"/><stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="g-gen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#047857"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="g-att" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400E"/><stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shd" x="-8%" y="-8%" width="122%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.18"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="860" height="1050" fill="#F1F5F9"/>
  <rect x="0" y="72" width="5" height="978" fill="#1D4ED8" opacity="0.4"/>
  <rect x="855" y="72" width="5" height="978" fill="#6D28D9" opacity="0.4"/>

  <!-- ── Header ── -->
  <rect width="860" height="72" fill="url(#g-hdr)"/>
  <text x="430" y="33" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="white">Architecture du Classifieur</text>
  <text x="430" y="56" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#C7D2FE">FacialCNN — CNN Multi-Tête · 6 blocs · channels=[32,64,128,256,256,256] · poids Kaiming</text>

  <!-- ── Input ── -->
  <rect x="230" y="90" width="400" height="50" rx="9" fill="url(#g-inp)" filter="url(#shd)"/>
  <text x="430" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="white">Entrée — Image faciale</text>
  <text x="430" y="130" text-anchor="middle" font-family="Courier New,monospace" font-size="12.5" fill="#BAE6FD">(B, 3, 64, 64)</text>

  <!-- arrow -->
  <line x1="430" y1="140" x2="430" y2="163" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ── BLOCK 1 ── -->
  <rect x="55" y="165" width="750" height="74" rx="11" fill="url(#g-blk)" filter="url(#shd)"/>
  <line x1="210" y1="174" x2="210" y2="235" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <text x="132" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">Bloc 1</text>
  <text x="132" y="215" text-anchor="middle" font-family="Courier New,monospace" font-size="10" fill="#93C5FD">32 canaux</text>
  <text x="490" y="194" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#BFDBFE">Conv3×3 (3 → 32)  ·  BatchNorm  ·  ReLU  ·  MaxPool2×2</text>
  <text x="490" y="213" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#93C5FD">Activation  Act₁  →  (B, 32, 32, 32)</text>
  <text x="490" y="229" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.45)">résolution spatiale : 64×64  →  32×32  (÷2 par MaxPool)</text>

  <line x1="430" y1="239" x2="430" y2="260" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ── BLOCK 2 ── -->
  <rect x="55" y="262" width="750" height="74" rx="11" fill="url(#g-blk)" filter="url(#shd)"/>
  <line x1="210" y1="271" x2="210" y2="332" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <text x="132" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">Bloc 2</text>
  <text x="132" y="312" text-anchor="middle" font-family="Courier New,monospace" font-size="10" fill="#93C5FD">64 canaux</text>
  <text x="490" y="291" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#BFDBFE">Conv3×3 (32 → 64)  ·  BatchNorm  ·  ReLU  ·  MaxPool2×2</text>
  <text x="490" y="310" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#93C5FD">Activation  Act₂  →  (B, 64, 16, 16)</text>
  <text x="490" y="326" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.45)">résolution spatiale : 32×32  →  16×16  (÷2 par MaxPool)</text>

  <line x1="430" y1="336" x2="430" y2="357" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ── BLOCK 3 ── -->
  <rect x="55" y="359" width="750" height="74" rx="11" fill="url(#g-blk)" filter="url(#shd)"/>
  <line x1="210" y1="368" x2="210" y2="429" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <text x="132" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">Bloc 3</text>
  <text x="132" y="409" text-anchor="middle" font-family="Courier New,monospace" font-size="10" fill="#93C5FD">128 canaux</text>
  <text x="490" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#BFDBFE">Conv3×3 (64 → 128)  ·  BatchNorm  ·  ReLU  ·  MaxPool2×2</text>
  <text x="490" y="407" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#93C5FD">Activation  Act₃  →  (B, 128, 8, 8)</text>
  <text x="490" y="423" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.45)">résolution spatiale : 16×16  →  8×8  (÷2 par MaxPool)</text>

  <line x1="430" y1="433" x2="430" y2="454" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ── BLOCK 4 ── -->
  <rect x="55" y="456" width="750" height="74" rx="11" fill="url(#g-blk)" filter="url(#shd)"/>
  <line x1="210" y1="465" x2="210" y2="526" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <text x="132" y="487" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">Bloc 4</text>
  <text x="132" y="506" text-anchor="middle" font-family="Courier New,monospace" font-size="10" fill="#93C5FD">256 canaux</text>
  <text x="490" y="485" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#BFDBFE">Conv3×3 (128 → 256)  ·  BatchNorm  ·  ReLU  ·  MaxPool2×2</text>
  <text x="490" y="504" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#93C5FD">Activation  Act₄  →  (B, 256, 4, 4)</text>
  <text x="490" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.45)">résolution spatiale : 8×8  →  4×4  (÷2 par MaxPool)</text>

  <line x1="430" y1="530" x2="430" y2="551" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ── BLOCK 5 ── -->
  <rect x="55" y="553" width="750" height="74" rx="11" fill="url(#g-blk)" filter="url(#shd)"/>
  <line x1="210" y1="562" x2="210" y2="623" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <text x="132" y="584" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">Bloc 5</text>
  <text x="132" y="603" text-anchor="middle" font-family="Courier New,monospace" font-size="10" fill="#93C5FD">256 canaux</text>
  <text x="490" y="582" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#BFDBFE">Conv3×3 (256 → 256)  ·  BatchNorm  ·  ReLU  ·  MaxPool2×2</text>
  <text x="490" y="601" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#93C5FD">Activation  Act₅  →  (B, 256, 2, 2)</text>
  <text x="490" y="617" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.45)">résolution spatiale : 4×4  →  2×2  (÷2 par MaxPool)</text>

  <line x1="430" y1="627" x2="430" y2="648" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ── BLOCK 6 ── -->
  <rect x="55" y="650" width="750" height="74" rx="11" fill="url(#g-blk6)" filter="url(#shd)"/>
  <line x1="210" y1="659" x2="210" y2="720" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <text x="132" y="681" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">Bloc 6</text>
  <text x="132" y="700" text-anchor="middle" font-family="Courier New,monospace" font-size="10" fill="#BFDBFE">256 canaux</text>
  <text x="490" y="679" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#DBEAFE">Conv3×3 (256 → 256)  ·  BatchNorm  ·  ReLU  (sans MaxPool)</text>
  <text x="490" y="698" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#BFDBFE">Activation  Act₆  →  (B, 256, 2, 2)</text>
  <text x="490" y="714" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="rgba(255,255,255,0.45)">résolution spatiale préservée : 2×2  (pas de pooling)</text>

  <line x1="430" y1="724" x2="430" y2="745" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- ── GAP ── -->
  <rect x="225" y="747" width="410" height="50" rx="11" fill="url(#g-gap)" filter="url(#shd)"/>
  <text x="430" y="768" text-anchor="middle" font-family="Arial,sans-serif" font-size="12.5" font-weight="bold" fill="white">AdaptiveAvgPool2d(1, 1)  +  Flatten</text>
  <text x="430" y="787" text-anchor="middle" font-family="Courier New,monospace" font-size="12.5" fill="#DDD6FE">→  (B, 256)</text>

  <!-- Branch arrows to heads -->
  <path d="M 378 797 C 345 816 240 818 225 836" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 482 797 C 515 816 620 818 635 836" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- ── HEAD GENRE ── -->
  <rect x="50" y="838" width="330" height="88" rx="11" fill="url(#g-gen)" filter="url(#shd)"/>
  <text x="215" y="861" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">Tête Genre</text>
  <text x="215" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#D1FAE5">Linear (256 → 2)</text>
  <text x="215" y="898" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#A7F3D0">Perte : CrossEntropyLoss  (Homme / Femme)</text>
  <text x="215" y="916" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#6EE7B7">gender_logits  →  (B, 2)</text>

  <!-- ── HEAD ATTRIBUTS ── -->
  <rect x="480" y="838" width="330" height="88" rx="11" fill="url(#g-att)" filter="url(#shd)"/>
  <text x="645" y="861" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="white">Tête Attributs</text>
  <text x="645" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#FEF3C7">Linear (256 → 6)</text>
  <text x="645" y="898" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#FDE68A">Perte : BCEWithLogitsLoss  (6 attributs binaires)</text>
  <text x="645" y="916" text-anchor="middle" font-family="Courier New,monospace" font-size="11" fill="#FCD34D">attr_logits  →  (B, 6)</text>

  <!-- Combined loss -->
  <rect x="185" y="942" width="490" height="30" rx="7" fill="#E0E7FF" stroke="#6366F1" stroke-width="1"/>
  <text x="430" y="961" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#312E81">ℒ = CrossEntropy(genre) + 2 × BCE(attributs)  ·  Adam (lr=3e-4, wd=1e-3)</text>

  <!-- Legend -->
  <rect x="45" y="983" width="770" height="22" rx="5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="58" y="989" width="11" height="11" rx="2" fill="#1D4ED8"/>
  <text x="74" y="998" font-family="Arial,sans-serif" font-size="10.5" fill="#334155">Blocs conv. 1–5 (avec MaxPool)</text>
  <rect x="245" y="989" width="11" height="11" rx="2" fill="#3B82F6"/>
  <text x="261" y="998" font-family="Arial,sans-serif" font-size="10.5" fill="#334155">Bloc 6 (sans MaxPool)</text>
  <rect x="396" y="989" width="11" height="11" rx="2" fill="#7C3AED"/>
  <text x="412" y="998" font-family="Arial,sans-serif" font-size="10.5" fill="#334155">GAP</text>
  <rect x="456" y="989" width="11" height="11" rx="2" fill="#059669"/>
  <text x="472" y="998" font-family="Arial,sans-serif" font-size="10.5" fill="#334155">Tête Genre</text>
  <rect x="562" y="989" width="11" height="11" rx="2" fill="#D97706"/>
  <text x="578" y="998" font-family="Arial,sans-serif" font-size="10.5" fill="#334155">Tête Attributs</text>
  <rect x="676" y="989" width="11" height="11" rx="2" fill="#0284C7"/>
  <text x="692" y="998" font-family="Arial,sans-serif" font-size="10.5" fill="#334155">Entrée</text>

  <text x="430" y="1042" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#94A3B8">LRAD · FacialCNN · config celeba_ood.yaml · channels=[32,64,128,256,256,256] · Les 6 activations Act₁…Act₆ alimentent les 6 décodeurs</text>
</svg>
