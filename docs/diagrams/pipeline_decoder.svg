  <line x1="30" y1="588" x2="1430" y2="588" stroke="#dfe4ec" stroke-width="1"/>

  <!-- Usage box -->
  <rect x="30" y="606" width="682" height="106" rx="8" fill="#f9fbfd" stroke="#8fa6c4" stroke-width="1.4"/>
  <text class="bt" x="46" y="628">À quoi servent les 5 reconstructions</text>
  <text class="bl" x="46" y="650">• f̂ₖ de chaque membre m  →  décomposition Risque = Biais + Variance par pixel (lrad/ensemble.py)</text>
  <text class="bl" x="46" y="669">• f̄₄ = moyenne des 8 membres au bloc le plus profond  →  entrée ré-encodée du signal locfre (feature_error.py)</text>
  <text class="bl" x="46" y="688">• f̂ₖ d’un seul membre  →  figures per_block_breakdown / fusion_overlay du dossier model_i/plots/</text>
  <text class="bl" x="46" y="705">• f̄ₖ  →  carte de biais (x − f̄ₖ)², classement des visages à lunettes par biais péri-oculaire</text>

  <rect x="728" y="606" width="702" height="106" rx="8" fill="#f9fbfd" stroke="#8fa6c4" stroke-width="1.4"/>
  <text class="bt" x="744" y="628">Perte de reconstruction — membre 0, échelle réelle du run</text>
  <text class="bl" x="744" y="650">MSE par bloc, époque 1  → [0.00340, 0.00539, 0.00769, 0.01174, 0.02017]</text>
  <text class="bl" x="744" y="669">MSE par bloc, époque 25 → [0.00043, 0.00150, 0.00327, 0.00532, 0.01124]</text>
  <text class="note" x="744" y="691">Plus le bloc est profond, plus la reconstruction est floue : l’information spatiale a été</text>
  <text class="note" x="744" y="706">détruite par les MaxPool. C’est exactement ce plancher d’erreur qui limite le score pixel.</text>

  <text class="sec" x="30" y="748">NOTES DE FIDÉLITÉ AU CODE</text>
  <text class="note" x="30" y="770">• ConvTranspose2d(4×4, stride 2, padding 1) double H et W exactement, sans ambiguïté de taille de sortie — d’où le choix de ce noyau plutôt que 3×3 ou 2×2.</text>
  <text class="note" x="30" y="790">• Le nombre de canaux est divisé par 2 à chaque étage avec un plancher min_channels = 16 ; d’où 32→16 et non 32→16→8. Le classifieur reste gelé (requires_grad = False).</text>
</svg>
