experiment:
  name: celeba_ood
  seed: 42
  output_dir: outputs/celeba_ood/run
dataset:
  root: /home/ybahaddo/lrad/data
  download: false
  image_size: 64
  batch_size: 256
  num_workers: 4
  train_ratio: 0.9
